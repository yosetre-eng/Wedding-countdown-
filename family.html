<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב אישורי הגעה | אגם ויוסף</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#FBF4E9; --mocha:#4A3527; --mocha-soft:#6B5140;
    --gold:#C6994F; --gold-light:#E4C889; --cream-deep:#F3E7D6;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background: var(--cream); color: var(--mocha);
    font-family:'Assistant', sans-serif; min-height:100vh;
    padding: 24px 16px 60px;
  }
  h1{
    font-family:'Frank Ruhl Libre', serif;
    text-align:center;
    font-size:22px;
    margin-bottom:4px;
  }
  .sub{ text-align:center; color: var(--mocha-soft); font-size:13px; margin-bottom:28px; }

  .login-card{
    max-width:360px; margin: 60px auto 0;
    background:#fff; border-radius:18px; padding:28px 22px;
    box-shadow: 0 12px 30px -16px rgba(74,53,39,0.28);
    border: 1px solid rgba(198,153,79,0.18);
  }
  .login-card input{
    width:100%; padding:12px 14px; margin-bottom:12px;
    border-radius:10px; border:1.5px solid rgba(198,153,79,0.3);
    font-size:15px; background: var(--cream); color: var(--mocha);
  }
  .login-card button{
    width:100%; padding:13px; border:none; border-radius:10px;
    background: var(--gold); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .login-error{ color:#B15F52; font-size:12.5px; margin-top:10px; text-align:center; display:none; }
  .not-authorized{
    max-width:360px; margin: 60px auto 0; text-align:center;
    background:#fff; border-radius:18px; padding:28px 22px;
    box-shadow: 0 12px 30px -16px rgba(74,53,39,0.28);
  }

  #dashboard{ display:none; max-width:640px; margin:0 auto; }
  .welcome{
    text-align:center; font-family:'Frank Ruhl Libre', serif;
    font-size:19px; font-weight:700; color: var(--mocha); margin-bottom:4px;
  }
  .side-names{ text-align:center; color: var(--gold); font-size:13px; font-weight:700; margin-bottom:22px; }

  .stats{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
  .stat-chip{
    background:#fff; border:1px solid rgba(198,153,79,0.25); border-radius:12px;
    padding:12px 18px; font-size:13px; font-weight:700; color: var(--mocha); text-align:center;
  }
  .stat-chip span{ display:block; color: var(--gold); font-size:22px; margin-bottom:2px; }

  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:12px; }
  button.logout-btn{
    background:#fff; color: var(--mocha); border:1.5px solid rgba(198,153,79,0.3);
    border-radius:10px; padding:8px 16px; font-weight:700; font-size:12.5px; cursor:pointer;
  }

  table{
    width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden;
    box-shadow: 0 12px 30px -16px rgba(74,53,39,0.28);
  }
  th, td{ padding:11px 12px; text-align:right; font-size:13.5px; border-bottom:1px solid rgba(198,153,79,0.12); }
  th{ background: var(--cream-deep); color: var(--mocha); font-weight:700; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  .status-pill{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;
  }
  .status-pill.coming{ background:#E9F0E7; color:#5C7A5C; }
  .status-pill.not_coming{ background:#F6E4E1; color:#B15F52; }
  .status-pill.unknown{ background:#F6EBD9; color:#9A7635; }
  .empty-state{ text-align:center; color: var(--mocha-soft); padding:40px 0; }
  .table-wrap{ overflow-x:auto; }
  .bsd-mark{
    position:fixed; top:14px; right:16px; z-index:999;
    font-family:'Frank Ruhl Libre', serif; font-size:13px; font-weight:600; color: var(--gold);
    padding: 3px 12px 7px 6px; border-top: 1px solid rgba(198,153,79,0.6); border-right: 1px solid rgba(198,153,79,0.6);
    border-radius: 0 10px 0 0; letter-spacing:0.03em;
  }
</style>
</head>
<body>

<div class="bsd-mark">בס״ד</div>

<h1>מעקב אישורי הגעה</h1>
<div class="sub">אגם & יוסף · 19.11.2026</div>

<div class="login-card" id="loginCard">
  <input type="email" id="loginEmail" placeholder="אימייל" autocomplete="username">
  <input type="password" id="loginPassword" placeholder="סיסמה" autocomplete="current-password">
  <button id="loginBtn">כניסה</button>
  <div class="login-error" id="loginError">פרטי התחברות שגויים</div>
</div>

<div class="not-authorized" id="notAuthorized" style="display:none;">
  <div style="font-size:32px; margin-bottom:10px;">🙈</div>
  <div style="font-weight:700; margin-bottom:6px;">החשבון הזה לא מוגדר לצפייה כאן</div>
  <div style="font-size:13px; color:var(--mocha-soft);">אם זו טעות, פנו ליוסף</div>
</div>

<div id="dashboard">
  <div class="welcome" id="welcomeText"></div>
  <div class="side-names" id="sideNamesText"></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button class="logout-btn" id="logoutBtn">התנתקות</button>
  </div>

  <div class="table-wrap">
    <table id="rsvpTable">
      <thead>
        <tr>
          <th>שם מלא</th>
          <th>טלפון</th>
          <th>סטטוס</th>
          <th>מס' אנשים</th>
        </tr>
      </thead>
      <tbody id="rsvpTbody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">עדיין אין אישורי הגעה מהצד שלכם</div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBNU3g9eJCFGFzoiyTGEDUU5cPeH8FYWtE",
    authDomain: "wedding-countdown-69115.firebaseapp.com",
    projectId: "wedding-countdown-69115",
    storageBucket: "wedding-countdown-69115.firebasestorage.app",
    messagingSenderId: "298027422124",
    appId: "1:298027422124:web:b7e58e8332c123e414ea09"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const statusLabels = { coming: 'מגיע/ה', not_coming: 'לא מגיע/ה', unknown: 'לא ידוע' };

  // Email -> family group mapping
  const EMAIL_GROUPS = {
    'me@daniel.md': 'trisman',
    'juditht4@yahoo.com': 'trisman',
    'shalgitzur123@gmail.com': 'tzur',
    'adidido169@gmail.com': 'tzur'
  };
  const GROUP_SIDES = {
    trisman: ['חברים של יוסף', 'חברי משפחת טרייסמן'],
    tzur: ['חברים של אגם', 'חברי משפחת צור']
  };
  const GROUP_LABELS = {
    trisman: 'חברים של יוסף וחברי משפחת טרייסמן',
    tzur: 'חברים של אגם וחברי משפחת צור'
  };

  let myGroup = null;
  let allRows = [];

  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    auth.signInWithEmailAndPassword(email, password).catch((err) => {
      errEl.textContent = 'שגיאה: ' + err.message;
      errEl.style.display = 'block';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged((user) => {
    if(user){
      const emailKey = (user.email || '').toLowerCase();
      myGroup = EMAIL_GROUPS[emailKey];
      document.getElementById('loginCard').style.display = 'none';
      if(!myGroup){
        document.getElementById('notAuthorized').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        return;
      }
      document.getElementById('notAuthorized').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('welcomeText').textContent = 'שלום!';
      document.getElementById('sideNamesText').textContent = GROUP_LABELS[myGroup];
      loadRsvps();
    } else {
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('notAuthorized').style.display = 'none';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  function waLink(phone){
    let digits = (phone || '').replace(/[^0-9]/g, '');
    if(digits.startsWith('0')) digits = '972' + digits.slice(1);
    return 'https://wa.me/' + digits;
  }

  function loadRsvps(){
    db.collection('rsvps').orderBy('date', 'desc').onSnapshot((snapshot) => {
      allRows = [];
      snapshot.forEach(doc => allRows.push(doc.data()));
      renderTable();
    }, (err) => {
      document.getElementById('emptyState').textContent = 'שגיאה בטעינת הנתונים: ' + err.message;
      document.getElementById('emptyState').style.display = 'block';
    });
  }

  function renderTable(){
    if(!myGroup) return;
    const mySides = GROUP_SIDES[myGroup];
    const rows = allRows.filter(r => mySides.includes(r.side));

    const tbody = document.getElementById('rsvpTbody');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';
    if(rows.length === 0){
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td></td><td></td><td></td><td></td>`;
        tr.children[0].textContent = r.name || '';

        if(r.phone){
          const link = document.createElement('a');
          link.href = waLink(r.phone);
          link.target = '_blank';
          link.rel = 'noopener';
          link.style.color = '#3C8C5C';
          link.style.fontWeight = '600';
          link.style.textDecoration = 'none';
          link.textContent = '📱 ' + r.phone;
          tr.children[1].appendChild(link);
        }

        const pill = document.createElement('span');
        pill.className = 'status-pill ' + (r.status || 'unknown');
        pill.textContent = statusLabels[r.status] || 'לא ידוע';
        tr.children[2].appendChild(pill);

        tr.children[3].textContent = (r.guestCount != null) ? r.guestCount : '';
        tbody.appendChild(tr);
      });
    }

    const comingCount = rows.filter(r => r.status === 'coming').reduce((s, r) => s + (r.guestCount||0), 0);
    const notComingCount = rows.filter(r => r.status === 'not_coming').length;
    const unknownCount = rows.filter(r => r.status === 'unknown').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat-chip"><span>${rows.length}</span>סה"כ טפסים</div>
      <div class="stat-chip"><span>${comingCount}</span>מגיעים</div>
      <div class="stat-chip"><span>${notComingCount}</span>לא מגיעים</div>
      <div class="stat-chip"><span>${unknownCount}</span>לא ידוע</div>
    `;
  }
</script>
</body>
</html>
