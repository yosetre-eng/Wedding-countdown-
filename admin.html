<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול אישורי הגעה | אגם ויוסף</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#FBF4E9; --mocha:#4A3527; --mocha-soft:#6B5140;
    --gold:#C6994F; --gold-light:#E4C889; --cream-deep:#F3E7D6;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background: var(--cream); color: var(--mocha);
    font-family:'Assistant', sans-serif; min-height:100vh;
    padding: 24px 16px 60px;
  }
  h1{
    font-family:'Frank Ruhl Libre', serif;
    text-align:center;
    font-size:24px;
    margin-bottom:4px;
  }
  .sub{ text-align:center; color: var(--mocha-soft); font-size:13px; margin-bottom:28px; }

  .login-card{
    max-width:360px; margin: 60px auto 0;
    background:#fff; border-radius:18px; padding:28px 22px;
    box-shadow: 0 12px 30px -16px rgba(74,53,39,0.28);
    border: 1px solid rgba(198,153,79,0.18);
  }
  .login-card input{
    width:100%; padding:12px 14px; margin-bottom:12px;
    border-radius:10px; border:1.5px solid rgba(198,153,79,0.3);
    font-size:15px; background: var(--cream); color: var(--mocha);
  }
  .login-card button{
    width:100%; padding:13px; border:none; border-radius:10px;
    background: var(--gold); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .login-error{ color:#B15F52; font-size:12.5px; margin-top:10px; text-align:center; display:none; }

  #dashboard{ display:none; max-width:900px; margin:0 auto; }
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat-chip{
    background:#fff; border:1px solid rgba(198,153,79,0.25); border-radius:12px;
    padding:10px 16px; font-size:13px; font-weight:700; color: var(--mocha);
  }
  .stat-chip span{ color: var(--gold); }
  .actions{ display:flex; gap:8px; }
  button.action-btn{
    background: var(--gold); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-weight:700; font-size:13px; cursor:pointer;
  }
  button.action-btn.secondary{
    background:#fff; color: var(--mocha); border:1.5px solid rgba(198,153,79,0.3);
  }
  table{
    width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden;
    box-shadow: 0 12px 30px -16px rgba(74,53,39,0.28);
  }
  th, td{ padding:11px 12px; text-align:right; font-size:13.5px; border-bottom:1px solid rgba(198,153,79,0.12); }
  th{ background: var(--cream-deep); color: var(--mocha); font-weight:700; }
  tr:last-child td{ border-bottom:none; }
  .status-pill{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;
  }
  .status-pill.coming{ background:#E9F0E7; color:#5C7A5C; }
  .status-pill.not_coming{ background:#F6E4E1; color:#B15F52; }
  .status-pill.unknown{ background:#F6EBD9; color:#9A7635; }
  .empty-state{ text-align:center; color: var(--mocha-soft); padding:40px 0; }
  .table-wrap{ overflow-x:auto; }
  .bsd-mark{
    position:fixed;
    top:14px; right:16px;
    z-index:999;
    font-family:'Frank Ruhl Libre', serif;
    font-size:13px;
    font-weight:600;
    color: var(--gold);
    padding: 3px 12px 7px 6px;
    border-top: 1px solid rgba(198,153,79,0.6);
    border-right: 1px solid rgba(198,153,79,0.6);
    border-radius: 0 10px 0 0;
    letter-spacing:0.03em;
  }
</style>
</head>
<body>

<div class="bsd-mark">בס״ד</div>

<h1>ניהול אישורי הגעה</h1>
<div class="sub">אגם & יוסף · 19.11.2026</div>

<div class="login-card" id="loginCard">
  <input type="email" id="loginEmail" placeholder="אימייל" autocomplete="username">
  <input type="password" id="loginPassword" placeholder="סיסמה" autocomplete="current-password">
  <button id="loginBtn">כניסה</button>
  <div class="login-error" id="loginError">פרטי התחברות שגויים</div>
</div>

<div id="dashboard">
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button class="action-btn" id="exportBtn">📥 ייצוא ל-Excel</button>
      <button class="action-btn secondary" id="logoutBtn">התנתקות</button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="rsvpTable">
      <thead>
        <tr>
          <th>שם מלא</th>
          <th>טלפון</th>
          <th>סטטוס</th>
          <th>מס' אנשים</th>
          <th>תאריך שליחה</th>
        </tr>
      </thead>
      <tbody id="rsvpTbody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">עדיין לא התקבלו אישורי הגעה</div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDjH_zSWNHjA17SLwmZMJKh75o6nL11hf4",
    authDomain: "wedding-8a708.firebaseapp.com",
    projectId: "wedding-8a708",
    storageBucket: "wedding-8a708.firebasestorage.app",
    messagingSenderId: "747962432230",
    appId: "1:747962432230:web:a58fb99eb7d74e91e9d927"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const statusLabels = { coming: 'מגיע/ה', not_coming: 'לא מגיע/ה', unknown: 'לא ידוע' };
  let currentRows = [];

  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginError').style.display = 'none';
    auth.signInWithEmailAndPassword(email, password).catch(() => {
      document.getElementById('loginError').style.display = 'block';
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged((user) => {
    if(user){
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadRsvps();
    } else {
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  function formatDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
  }

  function loadRsvps(){
    db.collection('rsvps').orderBy('date', 'desc').onSnapshot((snapshot) => {
      currentRows = [];
      snapshot.forEach(doc => currentRows.push(doc.data()));
      renderTable();
    });
  }

  function renderTable(){
    const tbody = document.getElementById('rsvpTbody');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';
    if(currentRows.length === 0){
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      currentRows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td></td><td></td><td></td><td></td><td></td>
        `;
        tr.children[0].textContent = r.name || '';
        tr.children[1].textContent = r.phone || '';
        const pill = document.createElement('span');
        pill.className = 'status-pill ' + (r.status || 'unknown');
        pill.textContent = statusLabels[r.status] || 'לא ידוע';
        tr.children[2].appendChild(pill);
        tr.children[3].textContent = (r.guestCount != null) ? r.guestCount : '';
        tr.children[4].textContent = r.date ? formatDate(r.date) : '';
        tbody.appendChild(tr);
      });
    }

    const comingCount = currentRows.filter(r => r.status === 'coming').reduce((s, r) => s + (r.guestCount||0), 0);
    const notComingCount = currentRows.filter(r => r.status === 'not_coming').length;
    const unknownCount = currentRows.filter(r => r.status === 'unknown').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat-chip">סה"כ טפסים: <span>${currentRows.length}</span></div>
      <div class="stat-chip">סה"כ אורחים מגיעים: <span>${comingCount}</span></div>
      <div class="stat-chip">לא מגיעים: <span>${notComingCount}</span></div>
      <div class="stat-chip">לא ידוע: <span>${unknownCount}</span></div>
    `;
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    const header = ['שם מלא', 'טלפון', 'סטטוס', 'מספר אנשים', 'תאריך שליחה'];
    const rows = currentRows.map(r => [
      r.name || '',
      r.phone || '',
      statusLabels[r.status] || '',
      r.guestCount != null ? r.guestCount : '',
      r.date ? formatDate(r.date) : ''
    ]);
    const csvContent = [header, ...rows]
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\r\n');
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'אישורי-הגעה-אגם-ויוסף.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
